<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AXIOME — Independent Software Engineer exploring the principles behind software, systems, and intelligence."
    />
    <meta name="theme-color" content="#f4f0e7" />
    <title>Trần Tuấn Phong — Software Engineer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="masthead" aria-label="Brand header">
        <div class="brand" aria-label="Trần Tuấn Phong">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-mark-core"></span>
          </span>
          <span class="brand-word">TRẦN TUẤN PHONG</span>
        </div>

        <div class="brand-meta">SOFTWARE ENGINEER</div>
      </header>

      <main class="hero" aria-label="Primary brand statement">
        <div class="content-block">
          <p class="eyebrow">SOFTWARE ENGINEER · SYSTEMS THINKER</p>
          <h1>
            Complex systems<br />
            <span class="headline-accent">Made clear</span>
          </h1>
          <p class="lede">
            Building thoughtful software by understanding the systems behind it.
          </p>

          <div class="actions">
            <a class="primary-action" href="mailto:contact@trantuanphong.com">Start a conversation</a>
            <div class="micro-note">
              <span>contact@trantuanphong.com</span>
            </div>
          </div>
        </div>

        <div class="visual-block">
          <div class="visual-panel">
            <div class="nebula" aria-hidden="true"></div>
            <div class="starfield" aria-hidden="true">
              <span class="star star-one"></span>
              <span class="star star-two"></span>
              <span class="star star-three"></span>
              <span class="star star-four"></span>
              <span class="star star-five"></span>
              <span class="shooting-star"></span>
            </div>
            <div class="moon-halo"></div>
            <div class="moon-disc"></div>
            <div class="moon-outline"></div>
            <svg class="constellation" viewBox="0 0 100 100" aria-hidden="true">
              <path class="constellation-path" d="M12 30 28 18 41 34 61 20 77 36 89 25" />
              <path class="constellation-path constellation-path-secondary" d="M15 72 31 61 45 75 63 61 82 75" />
              <circle cx="12" cy="30" r="1.1" />
              <circle cx="28" cy="18" r="1.5" />
              <circle cx="41" cy="34" r="1" />
              <circle cx="61" cy="20" r="1.4" />
              <circle cx="77" cy="36" r="1" />
              <circle cx="89" cy="25" r="1.3" />
              <circle cx="15" cy="72" r="1" />
              <circle cx="31" cy="61" r="1.2" />
              <circle cx="45" cy="75" r="1" />
              <circle cx="63" cy="61" r="1.4" />
              <circle cx="82" cy="75" r="1" />
            </svg>
            <div class="foundation-grid">
              <span class="grid-line line-a"></span>
              <span class="grid-line line-b"></span>
              <span class="grid-line line-c"></span>
              <span class="grid-line line-d"></span>
            </div>
            <div class="structure-block">
              <span class="block block-1"></span>
              <span class="block block-2"></span>
              <span class="block block-3"></span>
            </div>
            <div class="adaptive-line"></div>
            <div class="edge-glow"></div>
            <figure class="portrait-card">
              <img
                class="portrait-image"
                src="avatar.jpg"
                alt="Portrait of Trần Tuấn Phong"
                width="583"
                height="877"
                decoding="async"
              />
              <figcaption>
                <span>TRẦN TUẤN PHONG</span>
                <span>SOFTWARE ENGINEER</span>
              </figcaption>
            </figure>
            <div class="orbit" aria-hidden="true">
              <span class="orbit-spark orbit-spark-one"></span>
              <span class="orbit-spark orbit-spark-two"></span>
              <span class="orbit-spark orbit-spark-three"></span>
            </div>
            <span class="trace-node trace-node-one" aria-hidden="true"></span>
            <span class="trace-node trace-node-two" aria-hidden="true"></span>
          </div>
        </div>
      </main>

      <footer class="footer" aria-label="Brand philosophy">
        <span>Stable core</span>
        <span class="divider"></span>
        <span>Adaptive edge</span>
      </footer>
    </div>
    <script>
      const visualPanel = document.querySelector(".visual-panel");
      const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      if (finePointer.matches && !reducedMotion.matches) {
        let pointerFrame = 0;

        visualPanel.addEventListener("pointermove", (event) => {
          cancelAnimationFrame(pointerFrame);
          pointerFrame = requestAnimationFrame(() => {
            const bounds = visualPanel.getBoundingClientRect();
            const x = ((event.clientX - bounds.left) / bounds.width) * 100;
            const y = ((event.clientY - bounds.top) / bounds.height) * 100;

            visualPanel.style.setProperty("--spot-x", `${x}%`);
            visualPanel.style.setProperty("--spot-y", `${y}%`);
          });
        });

        visualPanel.addEventListener("pointerleave", () => {
          cancelAnimationFrame(pointerFrame);
          visualPanel.style.removeProperty("--spot-x");
          visualPanel.style.removeProperty("--spot-y");
        });
      }
    </script>
  </body>
</html>
